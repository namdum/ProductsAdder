plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.jetbrains.kotlin.android)
    id("kotlin-kapt")
    id("kotlin-parcelize")
    alias(libs.plugins.google.gms.google.services)
}

android {
    namespace 'com.example.productsadder'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.productsadder"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            debuggable true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding = true
    }
}


dependencies {

    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.navigation.fragment.ktx
    implementation libs.androidx.navigation.ui.ktx
    implementation libs.androidx.databinding.runtime
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    //Ssp Sdp
    implementation ("com.intuit.ssp:ssp-android:1.1.1")
    implementation ("com.intuit.sdp:sdp-android:1.1.1")

    //Firebase
    implementation("com.google.firebase:firebase-auth:22.2.0")

    //Coroutines with firebase
    implementation ("org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.6.4")

    //fire base
    implementation ("com.google.firebase:firebase-firestore-ktx:24.9.1")
    implementation ("com.google.firebase:firebase-storage:20.3.0")
    implementation("com.google.firebase:firebase-firestore:24.9.1")
    implementation("com.google.firebase:firebase-messaging:21.0.1")

    implementation platform('com.google.firebase:firebase-bom:32.2.0') // Use the latest BoM version
    implementation 'com.google.firebase:firebase-database'

    //Dagger hilt
    var dagger_version = "2.50"
    implementation ("com.google.dagger:dagger:$dagger_version")
    implementation ("com.google.dagger:dagger-android:$dagger_version")
    implementation ("com.google.dagger:dagger-android-support:$dagger_version")
    kapt ("com.google.dagger:dagger-compiler:$dagger_version")
    kapt ("com.google.dagger:dagger-android-processor:$dagger_version")
    annotationProcessor ("com.google.dagger:dagger-compiler:$dagger_version")
    compileOnly ("javax.annotation:jsr250-api:1.0")
    implementation ("javax.inject:javax.inject:1")

    //RxJava
    implementation ("io.reactivex.rxjava2:rxjava:2.2.8")
    implementation ("io.reactivex.rxjava2:rxandroid:2.1.1")
    implementation ("com.squareup.retrofit2:adapter-rxjava2:2.9.0")

    implementation ("com.squareup.retrofit2:retrofit:2.9.0")
    implementation ("com.squareup.retrofit2:converter-gson:2.9.0")
    implementation ("com.squareup.okhttp3:logging-interceptor:4.9.3")

    //glide
    implementation ("com.github.bumptech.glide:glide:4.12.0")
    annotationProcessor ("com.github.bumptech.glide:compiler:4.12.0")
    //circular image
    implementation ("de.hdodenhof:circleimageview:3.1.0")

    implementation ("com.github.skydoves:colorpickerview:2.2.4")
    implementation("com.jakewharton.rxbinding3:rxbinding:3.1.0")

    implementation ("com.jakewharton.timber:timber:5.0.1")

    implementation("com.jakewharton.rxbinding3:rxbinding-swiperefreshlayout:3.1.0")



}
kapt {
    correctErrorTypes = true
}
